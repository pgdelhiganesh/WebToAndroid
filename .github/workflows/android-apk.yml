name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Dump repo tree
        run: ls -R .

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Build APK with Debug Logging
        run: ./gradlew assembleDebug --info --stacktrace

      - name: List debug-apk folder
        run: ls -R app/build/outputs/apk/debug

      - name: List generated APK
        run: ls -l app/build/outputs/apk/debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WebToAndroid-APK
          path: app/build/outputs/apk/debug/app-debug.apk
