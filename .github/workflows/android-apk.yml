name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission to gradlew
        run: chmod +x "./WebToAndroid/gradlew"

      - name: Build APK with Debug Logging
        run: ./gradlew assembleDebug --debug
        working-directory: "./WebToAndroid"

      - name: List debug-apk folder
        run: ls -R WebToAndroid/app/build/outputs/apk/debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WebToAndroid-APK
          path: WebToAndroid/app/build/outputs/apk/debug/app-debug.apk
